# The five containers of a standard install, and the optional Chromium fallback on the chromium
# profile. See "Run locally with Docker Compose" in README.md. Only Caddy publishes a port. The others
# are reachable only on this project's Compose networks.
name: watchdog

# Web and worker read .env, and these override what must point inside the Compose network. The
# token is interpolated here as it is for Obscura, so both sides always hold the same value.
x-app-environment: &app-environment
  DATABASE_URL: postgres://watchdog:watchdog@postgres:5432/watchdog
  OBSCURA_CDP_URL: ws://obscura:9222
  OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:?set OBSCURA_CDP_TOKEN in .env}

services:
  # Better Auth keys its sign-in rate limit on X-Forwarded-For. Caddy ignores the value a client
  # sends and sets it to the connection's address, so a client can't choose its own key (ADR 0020).
  caddy:
    image: caddy:2.11.7-alpine
    command: caddy reverse-proxy --from :3000 --to web:3000
    # The image declares volumes for certificates and state. Plain HTTP keeps nothing worth saving,
    # and tmpfs stops each `up` after a `down` from leaving two anonymous volumes behind.
    tmpfs: [/data, /config]
    ports:
      - "3000:3000"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/auth/ok"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment: *app-environment
    # Node as PID 1 ignores SIGTERM until it installs a handler, e.g. while the worker migrates.
    # An init process forwards the signal, so `docker compose stop` never waits for SIGKILL.
    init: true
    # The worker reports healthy only after it has applied the migrations.
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/auth/ok"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment: *app-environment
    # Node as PID 1 ignores SIGTERM until it installs a handler, e.g. while the worker migrates.
    # An init process forwards the signal, so `docker compose stop` never waits for SIGKILL.
    init: true
    # On SIGTERM pg-boss waits up to 30 s for running polls, so Compose mustn't SIGKILL at 10 s.
    stop_grace_period: 40s
    # The chromium network has no route out, and only the worker shares it with Chromium.
    networks: [default, chromium]
    depends_on:
      postgres:
        condition: service_healthy
    # The worker writes this file once the migrations are applied and pg-boss is running.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/watchdog-worker-ready"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

  postgres:
    # The same major version as the integration tests (packages/db/src/testing/postgres.ts).
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: watchdog
      POSTGRES_PASSWORD: watchdog
      POSTGRES_DB: watchdog
    # Postgres 18 keeps its data under /var/lib/postgresql/18, so the volume sits one level up.
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "watchdog", "-d", "watchdog"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  obscura:
    # https://github.com/h4ckf0r0day/obscura (ADR 0010). It binds 0.0.0.0 inside the container and
    # refuses to start without a token of at least 32 bytes, which CDP clients send as a Bearer.
    # The public image is built without the stealth feature (ADR 0015), and blocks private addresses
    # unless --allow-private-network is passed, which it must never be here.
    image: h4ckf0r0day/obscura:0.2.6
    # Long-running instances grow in memory, so each worker is replaced past 512 MB or after an hour.
    # Recycling needs more than one worker.
    command: ["serve", "--port", "9222", "--host", "0.0.0.0", "--workers", "2", "--worker-max-rss", "512", "--worker-max-age", "3600"]
    environment:
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:?set OBSCURA_CDP_TOKEN in .env}
    # The image has no shell, so its own binary checks the port. Any answer, even the 401 that a
    # request without the token gets, means the CDP server is up.
    healthcheck:
      test: ["CMD", "/obscura", "fetch", "http://127.0.0.1:9222/json/version", "--dump", "original", "--allow-private-network"]
      timeout: 5s
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  chromium:
    # The Chromium fallback renderer (ADR 0031), started by `docker compose --profile chromium up`.
    # Every request its pages make is caught in the worker and fetched through the egress guard.
    # Anything that escapes that meets a network with no route out, so the port is never published.
    profiles: [chromium]
    build: docker/chromium
    environment:
      CHROMIUM_TOKEN: ${CHROMIUM_TOKEN:-}
    networks: [chromium]
    # A browser needs more shared memory than Docker's default 64 MB.
    shm_size: 1gb
    # Any answer, even the one a request without the token's path gets, means the server is up.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').catch(() => process.exit(1))"]
      timeout: 5s
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

networks:
  # Internal: no route out of it, so Chromium reaches only the worker.
  chromium:
    internal: true

volumes:
  postgres:
