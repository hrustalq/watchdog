# What `pnpm smoke` adds to compose.yaml. smoke.sh passes it after the other Compose files, and
# Compose resolves its paths against the first one's directory, the repo root.

# Web and worker reach the fakes below. The fakes' addresses are private, so the egress guard lets them
# through only by name. Both trust the CA the fixtures container makes, so its certificates for
# api.telegram.org, github.com and api.github.com pass. With no SMTP set, mail goes to their logs, which
# is where the test reads it.
x-app: &app
  environment:
    EGRESS_ALLOWLIST: fixtures,fake-llm,fixture-site,api.telegram.org,github.com,api.github.com
    TELEGRAM_BOT_TOKEN: "123456:smoke-token"
    NODE_EXTRA_CA_CERTS: /run/telegram-ca/root.crt
    # The Chromium fallback is on its profile in compose.yaml, which smoke.sh turns on for the run, so
    # the form offers it and the test adds a Source that uses it. The config loader takes both or
    # neither, and the service below gets the same token.
    CHROMIUM_URL: ws://chromium:3000
    CHROMIUM_TOKEN: &chromium-token smoke-chromium-token-of-at-least-32-bytes
  volumes:
    - telegram-ca:/run/telegram-ca:ro
  depends_on:
    fixtures:
      condition: service_healthy
    fake-telegram:
      condition: service_healthy
    fake-github:
      condition: service_healthy
    fixture-site:
      condition: service_healthy

services:
  # Serves the feeds the test adds as RSS Sources, so the run makes no live HTTP request. It also
  # answers TLS for the fixed hosts Watchdog calls — api.telegram.org for the Bot API, github.com for a
  # repo's releases.atom and api.github.com for the REST and Search APIs — and passes those on.
  fixtures:
    image: caddy:2.11.7-alpine
    networks:
      default:
        aliases: [api.telegram.org, github.com, api.github.com]
    volumes:
      - ./apps/e2e/fixtures/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/e2e/fixtures/feed.xml:/srv/feed.xml:ro
      - ./apps/e2e/fixtures/before-correction.xml:/srv/before-correction.xml:ro
      - ./apps/e2e/fixtures/after-correction.xml:/srv/after-correction.xml:ro
      - ./apps/e2e/fixtures/alerts.xml:/srv/alerts.xml:ro
      - telegram-ca:/data/caddy/pki/authorities/local
    # Where the test publishes alerts.xml's later entries.
    tmpfs: [/srv/published]
    # Web and worker read the CA once, when they start, so they wait for it. Caddy writes it readable
    # by root only, and they run as node, so the check also opens it to them, which passes once it exists.
    healthcheck:
      test: ["CMD", "chmod", "a+r", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 1s

  # The model the test adds, so the run makes no real model call and has no model bill.
  fake-llm:
    image: node:26-alpine
    command: ["node", "/srv/fake-llm.mjs"]
    # Node as PID 1 ignores SIGTERM, which would hold up each `down`.
    init: true
    volumes:
      - ./apps/e2e/fixtures/fake-llm.mjs:/srv/fake-llm.mjs:ro
    healthcheck: &node-fake-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 1s

  # The Telegram bot, so alerts and the chat link run with no real bot.
  fake-telegram:
    image: node:26-alpine
    command: ["node", "/srv/fake-telegram.mjs"]
    init: true
    volumes:
      - ./apps/e2e/fixtures/fake-telegram.mjs:/srv/fake-telegram.mjs:ro
    healthcheck: *node-fake-health

  # GitHub's releases feed and its issues and search APIs, so a GitHub Source of every kind runs
  # without a request to github.com or api.github.com.
  fake-github:
    image: node:26-alpine
    command: ["node", "/srv/fake-github.mjs"]
    init: true
    volumes:
      - ./apps/e2e/fixtures/fake-github.mjs:/srv/fake-github.mjs:ro
    healthcheck: *node-fake-health

  # The site the website Sources watch. A POST to /flip serves its second version, so the next poll
  # finds a change, and its status line is written by a script, so only a Renderer's read holds it.
  fixture-site:
    image: node:26-alpine
    command: ["node", "/srv/fixture-site.mjs"]
    init: true
    volumes:
      - ./apps/e2e/fixtures/fixture-site.mjs:/srv/fixture-site.mjs:ro
    healthcheck: *node-fake-health

  # Obscura blocks private addresses, and compose.yaml relies on that, so as it stands it can't read a
  # fixture on this network. The smoke network is internal, so this flag lets it reach the fixture site
  # and nothing outside the network: the one change the run makes to the renderer.
  obscura:
    command: ["serve", "--port", "9222", "--host", "0.0.0.0", "--workers", "2", "--worker-max-rss", "512", "--worker-max-age", "3600", "--allow-private-network"]

  chromium:
    environment:
      CHROMIUM_TOKEN: *chromium-token

  web: *app
  worker: *app

  # Caddy is the one container on a network with a way out, because it publishes the port the
  # test opens. Every other container is on the internal network only, so nothing leaves.
  caddy:
    networks: [default, published]

networks:
  default:
    internal: true
  published: {}

volumes:
  telegram-ca: {}
