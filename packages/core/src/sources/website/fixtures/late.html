<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acme status</title>
</head>
<body>
  <main>Loading…</main>
  <script>
    // The data a real status page fetches: it answers about a second after load, so a page read at
    // load carries the skeleton instead.
    fetch("/late-data").then((response) => response.text()).then((text) => {
      const status = document.createElement("div");
      status.id = "status";
      status.textContent = text;
      document.body.append(status);
    });
  </script>
</body>
</html>
