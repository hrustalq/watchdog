name: Release

# Keeps one release PR open that bumps the version and adds the next CHANGELOG.md section.
# A person merges it; then this run tags vX.Y.Z and publishes the GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  HUSKY: 0

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A PR opened with the default GITHUB_TOKEN triggers no workflows, so CI would never run on
      # the release PR. RELEASE_PLEASE_TOKEN (a fine-grained PAT or GitHub App token with contents
      # and pull-requests write) fixes that. Without it the release PR still opens, with no checks.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
