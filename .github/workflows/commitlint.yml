name: Commitlint

# Its own workflow, so a title edit reruns only this check and never replaces
# a failed CI run with a skipped one.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # commitlint is a root dev dependency; the workspace packages aren't needed.
      - run: pnpm install --frozen-lockfile --filter watchdog
      # PRs are squash-merged as "<title> (#<number>)", so that is what gets checked.
      # The title is untrusted input: it goes through env, never inline in the script.
      - name: Lint the PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | pnpm exec commitlint
      - name: Lint the pushed commit
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last
