name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Jobs run on the homelab's self-hosted runners (`runs-on: homelab`: ephemeral pods on
# the k3s cluster, hrustalq/homelab docs/ci-runners.md), except pull requests from forks:
# a runner pod has a privileged Docker daemon on a homelab node, so untrusted code stays
# on GitHub-hosted runners.

env:
  # CI is the gate that counts; it never installs the local git hooks.
  HUSKY: 0

jobs:
  checks:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'homelab' }}
    timeout-minutes: 15
    steps:
      # The docs submodule needs a Knowledge API key, and nothing here reads it.
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Separate steps so the failing one is named; later steps still run after a failure.
      - name: Lint
        run: pnpm turbo run lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm turbo run typecheck
      - name: Test (unit and integration)
        if: ${{ !cancelled() }}
        run: pnpm turbo run test

  # Builds the images and signs in on the whole Compose stack, which is too slow for every pull
  # request. The workflow runs on pushes to main only, so this job does too.
  smoke:
    if: github.event_name == 'push'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'homelab' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @watchdog/e2e
      - run: pnpm --filter @watchdog/e2e exec playwright install --with-deps chromium
      # The example values work as they are: no SMTP, so the links go to the web log.
      - run: cp .env.example .env
      - run: pnpm smoke
      - name: Keep the trace and the container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            apps/e2e/compose.log
