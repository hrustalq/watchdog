name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # CI is the gate that counts; it never installs the local git hooks.
  HUSKY: 0

jobs:
  checks:
    # A title edit only needs the commitlint job.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The docs submodule needs a Knowledge API key, and nothing here reads it.
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Separate steps so the failing one is named; later steps still run after a failure.
      - name: Lint
        run: pnpm turbo run lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm turbo run typecheck
      - name: Test (unit and integration)
        if: ${{ !cancelled() }}
        run: pnpm turbo run test

  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PRs are squash-merged and the title becomes the commit subject on main.
      # The title is untrusted input, so it goes through env, never inline in the script.
      - name: Lint the PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Lint the pushed commit
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last
