name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # CI is the gate that counts; it never installs the local git hooks.
  HUSKY: 0

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The docs submodule needs a Knowledge API key, and nothing here reads it.
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Separate steps so the failing one is named; later steps still run after a failure.
      - name: Lint
        run: pnpm turbo run lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm turbo run typecheck
      - name: Test (unit and integration)
        if: ${{ !cancelled() }}
        run: pnpm test:gate

  # Builds the images and signs in on the whole Compose stack, which is too slow for every pull
  # request. The workflow runs on pushes to main only, so this job does too.
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The run builds the Chromium fallback's image as well (apps/e2e/smoke.sh turns its profile on),
    # and on a runner without any layer cache that is another few minutes on top of the stack's own.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @watchdog/e2e
      - run: pnpm --filter @watchdog/e2e exec playwright install --with-deps chromium
      # The example values work as they are: no SMTP, so the links go to the web log.
      - run: cp .env.example .env
      - run: pnpm smoke
      - name: Keep the trace and the container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            apps/e2e/compose.log
