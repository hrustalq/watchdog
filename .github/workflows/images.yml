# Builds the two images the cluster runs (apps/web, apps/worker) for amd64 and
# pushes ghcr.io/<owner>/watchdog-<name>:sha-<commit> and :latest.
# The homelab repo's k8s/apps/watchdog pins :sha-<commit>, so a release there is
# "merge, then bump the tag". Only pushes to main build: a pull request's image
# would never be pulled.
name: images

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/worker/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  HUSKY: 0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: worker
            dockerfile: apps/worker/Dockerfile
    steps:
      # The docs submodule needs a Knowledge API key, and no image reads it.
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfiles build from the repo root (turbo prune), for the same reason
      # compose.yaml passes the root as the context.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/watchdog-${{ matrix.name }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/watchdog-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
